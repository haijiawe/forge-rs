name: ci

# Runs on every push and pull request. This is the gate the repository promises
# in AGENTS.md and README.md: formatting, lints, the architecture contract, the
# test suite, and a web-bundle build. `release.yml` is separate because it needs
# a tag and produces artifacts; nothing here uploads anything.
#
# Two jobs, two toolchains, on purpose:
#   * `test` builds and runs the suite on the *minimum* supported rustc (1.89,
#     set by rusqlite; see Cargo.toml `rust-version`). If a dependency starts
#     needing a newer compiler, this job is where it surfaces.
#   * `lint` runs on current stable, because clippy lints are introduced by new
#     releases: a developer on stable must not be able to commit a lint that a
#     pinned-toolchain lint job would never see (`is_multiple_of` is exactly
#     that kind of lint).
#
# Note on `--offline`: this repository's development machine is behind an
# rsproxy mirror, so the local Makefile and check.ps1 pass `--offline` to keep
# the loop honest about what the vendored registry holds. CI has no such
# constraint and a cold runner has an empty registry — passing `--offline` there
# would fail on the first run, so it is deliberately absent here.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI only: a contributor on a new rustc must be able to
  # build, but nothing lands with a lint the gate would have caught.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install the minimum supported Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.89-${{ hashFiles('**/Cargo.lock') }}

      - name: architecture contract
        run: cargo run --quiet -p archcheck

      - name: cargo test
        run: cargo test --workspace

  # Runtime evidence for the macOS enforcer, kept out of the `test` matrix so a
  # failure names sandbox-exec instead of an unrelated workspace test. The crate
  # is compiled for every host by `test`; this job actually runs the profile on
  # a real macOS kernel. Do not add `--offline` here: hosted runners start with
  # an empty registry, same reason as the `test` job above.
  sandbox-macos:
    name: sandbox macos-latest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install the minimum supported Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.89-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test (sandbox-exec evidence)
        run: cargo test -p forge-sandbox --test macos --lib

  lint:
    name: lint (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: unit tests
        working-directory: web
        run: npx vitest run

      - name: build
        working-directory: web
        run: npm run build

      - name: bundle budget
        working-directory: web
        # docs/02 §10.1 promises a 600 KiB gzip budget for the whole JS payload;
        # this measures the raw bundle, where 2 MB raw is the equivalent ceiling
        # (the shipped bundle is ~266 kB raw / ~82 kB gzip).
        run: |
          total=$(find dist/assets -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "js bytes: $total"
          if [ "$total" -gt 2000000 ]; then
            echo "::error::web bundle is $total bytes, over the 2,000,000 byte budget"
            exit 1
          fi