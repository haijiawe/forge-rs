name: ci

# Runs on pushes and pull requests, but not on changes that cannot affect a
# build: a `docs:` commit must not buy three operating systems of compilation.
#
# The cost model matters here. GitHub bills a private repository's hosted
# runners out of a shared monthly pool (2,000 minutes on the free and education
# plans), and not at the same rate: Linux counts 1×, Windows 2×, macOS 10×. A
# five-job matrix on every push therefore spends its minutes unevenly — the
# macOS sandbox job alone costs as much as ten Linux jobs of the same length.
# See docs/ci.md for the measured numbers. Nothing in this file exists to make
# the gate weaker: `test` and `lint` still run on every change that can break a
# build, and the `release.yml` workflow is untouched.
#
# Two jobs, two toolchains, on purpose:
#   * `test` builds and runs the suite on the *minimum* supported rustc (1.89,
#     set by rusqlite; see Cargo.toml `rust-version`). If a dependency starts
#     needing a newer compiler, this job is where it surfaces.
#   * `lint` runs on current stable, because clippy lints are introduced by new
#     releases: a developer on stable must not be able to commit a lint that a
#     pinned-toolchain lint job would never see (`is_multiple_of` is exactly
#     that kind of lint).
#
# Note on `--offline`: this repository's development machine is behind an
# rsproxy mirror, so the local Makefile and check.ps1 pass `--offline` to keep
# the loop honest about what the vendored registry holds. CI has no such
# constraint and a cold runner has an empty registry — passing `--offline` there
# would fail on the first run, so it is deliberately absent here.
on:
  push:
    branches: ["**"]
    # A documentation-only commit leaves every source file byte-identical, so
    # there is nothing for a compiler to disagree with. Markdown and docs/ are
    # the only things skipped; anything else — including a workflow edit — runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A superseded run is worth nothing: the newer commit contains the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI only: a contributor on a new rustc must be able to
  # build, but nothing lands with a lint the gate would have caught.
  RUSTFLAGS: -D warnings

jobs:
  # One cheap Linux job decides what the expensive jobs should do. Without it
  # every job needs its own checkout-and-diff, and a macOS runner would have to
  # start before it could discover it had nothing to do.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      web: ${{ steps.diff.outputs.web }}
      sandbox: ${{ steps.diff.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Comparing against the push's base commit needs history. The
          # repository is small enough that a full clone is cheaper than the
          # minutes an under-fetched diff would waste.
          fetch-depth: 0

      - name: diff against the base commit
        id: diff
        shell: bash
        run: |
          set -eu
          base=""
          case "$GITHUB_EVENT_NAME" in
            push) base="${{ github.event.before }}" ;;
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
          esac

          # A manual run is a person asking for everything, a new branch has no
          # base to compare against, and a force-push can name a commit the
          # runner never fetched. In all three cases: run everything.
          if [ -n "$base" ] \
             && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          else
            changed=$(git ls-files)
          fi

          rust=false
          web=false
          sandbox=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*) continue ;;
              *.md) continue ;;
              LICENSE) continue ;;
              web/*) web=true ;;
              crates/sandbox/*|crates/exec/*) rust=true; sandbox=true ;;
              Cargo.toml|Cargo.lock|.github/*|rust-toolchain*|Makefile|check.ps1) rust=true ;;
              *) rust=true ;;
            esac
          done <<< "$changed"

          echo "changed:"; printf '%s\n' "$changed"
          {
            echo "rust=$rust"
            echo "web=$web"
            echo "sandbox=$sandbox"
          } >> "$GITHUB_OUTPUT"

  test:
    name: test ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install the minimum supported Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.89-${{ hashFiles('**/Cargo.lock') }}

      - name: architecture contract
        run: cargo run --quiet -p archcheck

      - name: cargo test
        run: cargo test --workspace

  # Runtime evidence for the macOS enforcer, kept out of the `test` matrix so a
  # failure names sandbox-exec instead of an unrelated workspace test. The crate
  # is compiled for every host by `test`; this job actually runs the profile on
  # a real macOS kernel. Do not add `--offline` here: hosted runners start with
  # an empty registry, same reason as the `test` job above.
  #
  # This is the most expensive job in the file — macOS bills at ten times the
  # Linux rate — and it can only fail in the two crates it exercises, so it runs
  # only when those changed (or when anything re-resolves dependencies).
  sandbox-macos:
    name: sandbox macos-latest
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install the minimum supported Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.89-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test (sandbox-exec evidence)
        run: cargo test -p forge-sandbox --test macos --lib

  lint:
    name: lint (stable)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: web bundle
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: unit tests
        working-directory: web
        run: npx vitest run

      - name: build
        working-directory: web
        run: npm run build

      - name: bundle budget
        working-directory: web
        # docs/02 §10.1 promises a 600 KiB gzip budget for the whole JS payload;
        # this measures the raw bundle, where 2 MB raw is the equivalent ceiling
        # (the shipped bundle is ~266 kB raw / ~82 kB gzip).
        run: |
          total=$(find dist/assets -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "js bytes: $total"
          if [ "$total" -gt 2000000 ]; then
            echo "::error::web bundle is $total bytes, over the 2,000,000 byte budget"
            exit 1
          fi