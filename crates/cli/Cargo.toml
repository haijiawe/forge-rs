hearth-import = { path = "../import" }
hearth-mcp = { path = "../mcp" }
hearth-skill = { path = "../skill" }
hearth-subagent = { path = "../subagent" }
hearth-goal = { path = "../goal" }
hearth-schedule = { path = "../schedule" }
hearth-plugin = { path = "../plugin" }
hearth-experts = { path = "../experts" }
hearth-team = { path = "../team" }
hearth-market = { path = "../market" }
hearth-context = { path = "../context" }
getrandom.workspace = true
