[package]
name = "forge-cli"
description = "the forge binary: argument parsing, help, doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../core" }
forge-config = { path = "../config" }
forge-sandbox = { path = "../sandbox" }
forge-llm = { path = "../llm" }
forge-session = { path = "../session" }
forge-agent = { path = "../agent" }
forge-tool = { path = "../tool" }
forge-net = { path = "../net" }
forge-server = { path = "../server" }
forge-protocol = { path = "../protocol" }
forge-store = { path = "../store" }
forge-import = { path = "../import" }
forge-mcp = { path = "../mcp" }
forge-skill = { path = "../skill" }
forge-subagent = { path = "../subagent" }
getrandom.workspace = true
ctrlc = "3.4"
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
