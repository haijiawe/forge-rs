[package]
name = "hearth-sandbox"
description = "containment: job objects, landlock, sandbox-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hearth-core = { path = "../core" }
# The Linux Landlock enforcer re-executes the harness as a wrapper; the spec
# travels to that child as JSON because the environment is the only channel
# that survives execve without a second binary.
serde = { workspace = true }
serde_json = { workspace = true }