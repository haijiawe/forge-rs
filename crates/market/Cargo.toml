[package]
name = "forge-market"
description = "plugin market client: index, checksummed download, tarball extraction, install records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../core" }
forge-net = { path = "../net" }
# SHA-256 of a downloaded tarball, and of every extracted file. Already in the
# budget because rustls needs a digest; `sha2` would be a second implementation
# of the same function in the same binary.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
