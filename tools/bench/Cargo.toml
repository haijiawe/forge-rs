[package]
name = "hearth-bench"
description = "cross-platform performance harness and per-platform baseline gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hearth-bench"
path = "src/main.rs"

[dependencies]
hearth-core = { path = "../../crates/core" }
hearth-session = { path = "../../crates/session" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
