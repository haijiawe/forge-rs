# architecture.yaml — the crate-layer map for hearth.
#
# Cargo can see that a dependency exists; it cannot see that the dependency
# points the wrong way. This file supplies the missing half: a layer per crate,
# and the rule that an edge may point only to a lower or equal layer.
#
# The layer table is the single source of truth. docs/08-rust-port.md §2
# explains why each crate sits where it does; a crate that moves layers moves
# here first, in the same change.
version: 1

layers:
  L0: [hearth-core, hearth-config]
  L1: [hearth-exec, hearth-sandbox, hearth-mcp, hearth-skill, hearth-net, hearth-experts]
  L2: [hearth-session, hearth-llm, hearth-tool, hearth-protocol, hearth-agent, hearth-store, hearth-import, hearth-subagent, hearth-goal, hearth-schedule, hearth-market, hearth-plugin, hearth-team, hearth-context]
  L3: [hearth-server, hearth-cli]

# Same-layer edges the layer rule cannot judge but §2 forbids outright.
# hearth-core is the vocabulary every crate shares, so it may import no other
# hearth crate; hearth-llm must not know that sessions exist.
forbidden_edges:
  - [hearth-core, hearth-config]
  - [hearth-llm, hearth-session]

# Tooling artifacts, never crates.
ignore_dirs: [.git, target, node_modules]
