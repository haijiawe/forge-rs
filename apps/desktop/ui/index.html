<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>hearth</title>
    <style>
      /* The first thing anyone sees: a window with a word in it, for as long as
         the local server takes to answer. Deliberately quiet -- a spinner that
         outlives a fast start is worse than a sentence that does. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1c21;
        color: #e8eaee;
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        height: 100%;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #23262d;
        border: 1px solid #33363e;
        display: grid;
        place-items: center;
        font-size: 26px;
      }
      p {
        margin: 0;
        color: #8b8f98;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">🔥</div>
      <p>starting hearth…</p>
    </main>
  </body>
</html>
