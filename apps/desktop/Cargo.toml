[package]
name = "hearth-desktop"
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "The hearth desktop shell: a window around the local server."

# Deliberately its own workspace. This crate is not part of the layer map in
# `architecture.yaml`, it is not built by `check.ps1`, and adding it to the root
# workspace would make every Linux CI job install webkit2gtk to compile a window
# frame. The shell has no business in the crate graph: it depends on the server
# only by starting it as a child process, so there is nothing to type-check
# across the boundary.
[workspace]

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"